[package]
name = "marketplace-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.7.2"
actix-web = "4.10.2"
argon2 = "0.5"
aws-config = "1.6.1"
aws-sdk-s3 = "1.82.0"
aws-types = "1.1"
bigdecimal = { version = "0.4.8", features = ["serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
dotenv = "0.15"
futures = "0.3.31"
futures-util = "0.3.31"
jsonwebtoken = "9"
lettre = { version = "0.11.15" }
mime_guess = "2.0"
once_cell = "1.19"
rand_core = "0.9.3"
regex = "1"
reqwest = { version = "0.12.15", features = ["json", "multipart"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.5", features = [ "postgres", "macros", "runtime-tokio", "tls-rustls", "uuid", "chrono", "bigdecimal" ] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5.3.1", features = ["macros", "actix_extras", "chrono", "uuid"] }
utoipa-actix-web = "0.1.2"
utoipa-scalar = { version = "0.3.0", features = ["actix-web"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1", features = ["serde", "v4"] }
